name: "OwnOriginalDataset"
data_dir: "data/collect"
image_size: [128, 128]
channels: 3

# ── Chế độ Person: Chia theo số người ────────────────────────────
split_mode: "person"
seed: 42
hand_filter: "left"

# Số người cho mỗi nhóm (Bạn có thể điều chỉnh lại tuỳ theo số lượng thực tế thu thập)
num_train_persons: 160      # X: người dùng để train embedding
num_known_persons: 40     # Y: người known (register + probe)
num_stranger_persons: 31    # Z: người lạ (impostor); null → dùng toàn bộ còn lại

# Tỷ lệ ảnh của Y người dùng làm gallery (register), phần còn lại làm probe
register_ratio: 0.5

transforms:
  random_grayscale: 0.5
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
  random_affine:
    translate: [0.1, 0.1]
    scale: [0.9, 1.1]
