dataset:
  name: iitd
  data_dir: data/IITD Palmprint V1/Segmented
  image_size:
  - 150
  - 150
  channels: 3
  hand_filter: left
  split_mode: person
  seed: 42
  num_train_persons: 2
  num_known_persons: 2
  num_stranger_persons: 1
  register_ratio: 0.5
  transforms:
    random_grayscale: 0.5
    random_rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    random_affine:
      translate:
      - 0.1
      - 0.1
      scale:
      - 0.9
      - 1.1
model:
  type: unet
  encoder:
    backbone: cnn
    hidden_dims:
    - 32
    - 64
    - 128
    latent_dim: 128
  decoder:
    use_decoder: true
    skip_dropout: 0.8
    image_size:
    - 150
    - 150
    unet_channels:
    - 64
    - 128
    - 256
    - 512
  verifier:
    hidden_dims:
    - 256
    - 128
  projector:
    use_mlp: false
    hidden_dims:
    - 256
    activation: ReLU
    proj_dim: 128
    use_bn: true
training:
  epochs: 30
  batch_size: 4
  num_workers: 2
  learning_rate: 0.1
  weight_decay: 0.0001
  optimizer: AdamW
  scheduler: StepLR
  scheduler_step_size: 5
  scheduler_gamma: 0.1
  log_interval: 10
  save_interval: 1
  use_sampler: true
  sampler_type: pk_sampler
  sampler_p: 2
  sampler_k: 2
  seed: 42
  accelerator: auto
  devices: 1
  resume_from_checkpoint: null
  fast_dev_run: true
losses:
  contrastive_type: ms_loss
  ms_alpha: 2.0
  ms_beta: 48.0
  ms_base: 0.3
  temperature: 0.1
sampling:
  training:
    mode: stochastic
    temperature: 1.0
  representation:
    mode: deterministic
    temperature: 0.0
  reconstruction:
    mode: stochastic
    temperature: 0.1
  variation:
    mode: stochastic
    temperature: 1.0
  exploration:
    mode: stochastic
    temperature: 1.5
  symmetric:
    mode: symmetric
    temperature: 0.0
  average:
    mode: stochastic
    temperature: 1.0
  interpolate:
    mode: deterministic
    temperature: 0.0
loss_schedules:
  beta_kl:
    type: constant
    value: 0.0
  lambda_con:
    type: constant
    value: 1.0
  lambda_rec:
    type: constant
    value: 0.0
  lambda_unc:
    type: constant
    value: 0.0
logging:
  log_dir: tests/temp_logs
  experiment_name: ''
  enable_tensorboard: true
  prog_bar_details: true
  progress_bar_refresh_rate: 1
represent:
  mode: single
  re_encode: false
  num_samples: 512
  pos_strategy: stochastic
  pos_temperature: 1.0
  neg_strategy: random
  neg_temperature: 1.0
  max_steps: 200
  lr: 0.01
  bce_threshold: 0.5
seed: 42
